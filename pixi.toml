[workspace]
authors = ["Hannes Neuschmidt <hannes.neuschmidt@brockmann-consult.de>"]
channels = ["conda-forge"]
name = "heatwise-interoperability-demonstration"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
bash_kernel = ">=0.10.0,<0.11"
geopandas = ">=1.1.4,<2"
pystac = ">=1.15.2,<2"
shapely = ">=2.1.2,<3"

[environments]
dev = ["dev", "docs"]

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
prek = ">=0.5.1,<0.6"
pytest-cov = ">=7.1.0,<8"

[feature.docs.dependencies]
quarto = ">=1.9.38,<2"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
stac-valid = ">=4.5.2, <5"
